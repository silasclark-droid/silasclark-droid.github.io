// Parse maze string into numeric grid
// # -> 1(wall), . -> 2(dot), * -> 3(power), P -> 0(pen-open), space -> 0(open)
function parseMaze(strArr){
  return strArr.map(row=>{
    const a=[];
    for(let c=0;c<NC;c++){
      const ch=row[c]||' ';
      if(ch==='#') a.push(1);
      else if(ch==='.') a.push(2);
      else if(ch==='*') a.push(3);
      else a.push(0);
    }
    return a;
  });
}

let maze=[], totalDots=0, dotsEaten=0;
function buildMaze(mi){
  const src=M[mi%4];
  maze=parseMaze(src);
  // Mirror the left half to the right so the maze is fully symmetric
  for(let r=0;r<NR;r++){
    for(let c=0;c<NC/2;c++){
      maze[r][NC-1-c]=maze[r][c];
    }
  }
  // Turn corner dots into power pellets if open
  [[1,1],[1,26],[29,1],[29,26]].forEach(([r,c])=>{
    if(maze[r][c]===2) maze[r][c]=3;
  });
  // Force power pellets at corners if none in parsed
  totalDots=0; dotsEaten=0;
  for(let r=0;r<NR;r++) for(let c=0;c<NC;c++)
    if(maze[r][c]===2||maze[r][c]===3) totalDots++;
  if(totalDots<50){
    // fill dots on open tiles
    for(let r=0;r<NR;r++) for(let c=0;c<NC;c++)
      if(maze[r][c]===0&&!isPen(r,c)) maze[r][c]=2;
    totalDots=0; dotsEaten=0;
    for(let r=0;r<NR;r++) for(let c=0;c<NC;c++)
      if(maze[r][c]===2||maze[r][c]===3) totalDots++;
  }
  // Remove unreachable dots so every level can be completed.
  const startR=23, startC=14;
  const reachable=new Uint8Array(NR*NC);
  const queue=[{r:startR,c:startC}];
  reachable[startR*NC+startC]=1;
  while(queue.length){
    const {r,c}=queue.shift();
    const dirs=[{dr:-1,dc:0},{dr:1,dc:0},{dr:0,dc:-1},{dr:0,dc:1}];
    for(const d of dirs){
      const nr=r+d.dr, nc=((c+d.dc)+NC)%NC;
      if(nr<0||nr>=NR) continue;
      if(isWall(nr,nc)) continue;
      const idx=nr*NC+nc;
      if(reachable[idx]) continue;
      reachable[idx]=1;
      queue.push({r:nr,c:nc});
    }
  }
  for(let r=0;r<NR;r++){
    for(let c=0;c<NC;c++){
      const idx=r*NC+c;
      if(!reachable[idx] && (maze[r][c]===2 || maze[r][c]===3)){
        maze[r][c]=0;
      }
    }
  }
  totalDots=0;
  for(let r=0;r<NR;r++) for(let c=0;c<NC;c++)
    if(maze[r][c]===2||maze[r][c]===3) totalDots++;
}

function isWall(r,c){
  if(r<0||r>=NR) return true;
  c=((c%NC)+NC)%NC;
  return maze[r][c]===1;
}
function isPen(r,c){ return r>=12&&r<=16&&c>=11&&c<=16; }

// ── BFS PATHFINDING ────────────────────────────────────
function bfs(sr,sc,tr,tc,avDr,avDc,noPen){
  if(sr===tr&&sc===tc) return null;
  const visited=new Uint8Array(NR*NC);
  visited[sr*NC+((sc+NC)%NC)]=1;
  const queue=[];
  const DIRS=[{dr:-1,dc:0},{dr:1,dc:0},{dr:0,dc:-1},{dr:0,dc:1}];
  // First step (apply no-reverse rule)
  for(const d of DIRS){
    if(d.dr===avDr&&d.dc===avDc) continue;
    const nr=sr+d.dr, nc=((sc+d.dc)+NC)%NC;
    if(nr<0||nr>=NR) continue;
    if(isWall(nr,nc)) continue;
    if(noPen&&isPen(nr,nc)) continue;
    if(visited[nr*NC+nc]) continue;
    visited[nr*NC+nc]=1;
    queue.push({r:nr,c:nc,fd:d});
  }
  let head=0;
  while(head<queue.length){
    const {r,c,fd}=queue[head++];
    if(r===tr&&c===((tc+NC)%NC)) return fd;
    for(const d of DIRS){
      const nr=r+d.dr, nc=((c+d.dc)+NC)%NC;
      if(nr<0||nr>=NR) continue;
      if(isWall(nr,nc)) continue;
      if(noPen&&isPen(nr,nc)) continue;
      if(visited[nr*NC+nc]) continue;
      visited[nr*NC+nc]=1;
      queue.push({r:nr,c:nc,fd});
    }
  }
  // Fallback: pick any valid direction
  for(const d of DIRS){
    const nr=sr+d.dr, nc=((sc+d.dc)+NC)%NC;
    if(nr<0||nr>=NR||isWall(nr,nc)) continue;
    if(noPen&&isPen(nr,nc)) continue;
    return d;
  }
  return null;
}

// ── PAC-MAN ───────────────────────────────────────────
function makePac(){
  return {
    r:23,c:14, // tile coords
    x:14*T+T/2, y:23*T+T/2,
    dr:0,dc:0, qr:0,qc:0, qBuf:0,
    prog:0,          // 0-1 progress to next tile
    nr:23,nc:14,     // next tile
    mouth:0.05,mdir:1,
    alive:true,deathF:0
  };
}

const SNAP=4; // px threshold for direction change attempt

function stepPac(dt){
  if(!pac.alive) return;
  const spd=(speedOn?baseSpd*3:baseSpd)*(1+(owned.speed_up||0)*0.1);

  pac.mouth+=0.16*pac.mdir;
  if(pac.mouth>=0.28)pac.mdir=-1;
  if(pac.mouth<=0.03)pac.mdir=1;

  // Target pixel = current tile centre
  const tileR=Math.floor(pac.y/T), tileC=Math.floor(pac.x/T);
  const midX=tileC*T+T/2, midY=tileR*T+T/2;
  const nearX=Math.abs(pac.x-midX)<SNAP+spd, nearY=Math.abs(pac.y-midY)<SNAP+spd;

  if(nearX&&nearY){
    // Try queued direction
    if(pac.qBuf>0){
      pac.qBuf--;
      if(!isWall(tileR+pac.qr,tileC+pac.qc)){
        pac.dr=pac.qr; pac.dc=pac.qc; pac.qBuf=0;
        pac.x=midX; pac.y=midY;
      }
    }
    // Current direction blocked → stop
    if(pac.dr!==0||pac.dc!==0){
      if(isWall(tileR+pac.dr,tileC+pac.dc)){
        pac.x=midX; pac.y=midY; pac.dr=0; pac.dc=0;
      }
    }
  }

  // Move
  if(pac.dc!==0){
    const nx=pac.x+pac.dc*spd;
    const lc=pac.dc>0?Math.floor((nx+T/2-1)/T):Math.floor((nx-T/2+1)/T);
    if(!isWall(tileR,lc)) pac.x=nx;
    else pac.x=pac.dc>0?lc*T-T/2:(lc+1)*T+T/2;
  }
  if(pac.dr!==0){
    const ny=pac.y+pac.dr*spd;
    const lr2=pac.dr>0?Math.floor((ny+T/2-1)/T):Math.floor((ny-T/2+1)/T);
    if(!isWall(lr2,tileC)) pac.y=ny;
    else pac.y=pac.dr>0?lr2*T-T/2:(lr2+1)*T+T/2;
  }

  // Tunnel
  if(pac.x<-T/2) pac.x=NC*T+T/2;
  if(pac.x>NC*T+T/2) pac.x=-T/2;
  pac.r=Math.round((pac.y-T/2)/T); pac.c=((Math.round((pac.x-T/2)/T))%NC+NC)%NC;

  eatTile();
  checkGhostCollision();
  if(dotsEaten>=totalDots) startLevelWin();
}

function eatTile(){
  const er=Math.round((pac.y-T/2)/T);
  const ec=((Math.round((pac.x-T/2)/T))%NC+NC)%NC;
  if(er<0||er>=NR) return;
  const m=maze[er][ec];
  if(m===2){
    maze[er][ec]=0; score+=doublePoints?20:10; dotsEaten++;
    coins++; totalCoins++;
    addP(pac.x,pac.y,0,-0.5,'#FFD700',5);
  } else if(m===3){
    maze[er][ec]=0; score+=doublePoints?100:50; dotsEaten++;
    coins+=5; totalCoins+=5;
    const dur=8000*(1+(owned.pellet_ext||0)*0.5);
    frightLeft=dur; eatMul=1;
    ghosts.forEach(g=>{if(g.mode==='scatter'||g.mode==='chase'){g.mode='fright';g.fright=true;}});
    if(boss&&!boss.dead) bossFright=true,bossFrightTimer=dur;
    boom(pac.x,pac.y,'#FFF',16);
  }
  if(fruit&&Math.abs(pac.x-fruit.x)<T-1&&Math.abs(pac.y-fruit.y)<T-1){
    const pts=FRUITS[fruit.type].pts*level*(doublePoints?2:1);
    score+=pts; coins+=Math.floor(pts/10);
    showMsg(`+${pts} ${FRUITS[fruit.type].ic}`);
    boom(fruit.x,fruit.y,'#FFD700',22);
    gainAbility(); fruit=null;
  }
}

function checkGhostCollision(){
  const all=[...ghosts,...(boss&&!boss.dead?[boss]:[])];
  all.forEach(g=>{
    if(!g||g.mode==='pen') return;
    const d=Math.hypot(pac.x-g.x,pac.y-g.y);
    const hitR=g===boss?T*1.6:T*0.82;
    if(d<hitR){
      const fright=g===boss?bossFright:g.fright;
      const eaten=g===boss?false:g.eaten;
      if(fright&&!eaten){
        if(g===boss){
          boss.hp--;
          bossFright=false;
          showMsg(`BOSS HIT! ${boss.hp}HP left`);
          boom(g.x,g.y,'#FF4500',25);
          if(boss.hp<=0){boss.dead=true;endBoss();return;}
        } else {
          const pts=200*eatMul; score+=pts; coins+=20; eatMul*=2;
          showMsg(`+${pts} 👻`);
          ghostEaten(g);
        }
      } else if(!eaten&&g.mode!=='eaten'&&!fright){
        if(shieldOn){boom(g.x,g.y,'#9B59B6',8);return;}
        doPacDeath();
      }
    }
  });
}

// ── GHOST SYSTEM ──────────────────────────────────────
// Tile-based movement: ghost moves from current tile to next tile
// When arriving at next tile, BFS to new target and commit direction
function makeGhost(id){
  const starts=[{r:11,c:14},{r:14,c:12},{r:14,c:14},{r:14,c:16}];
  const s=starts[id];
  return {
    id, col:GCOLS[id], name:GNAMES[id],
    r:s.r, c:s.c,       // current tile
    nr:s.r, nc:s.c,     // next tile (same at start)
    dr:0, dc:0,
    x:s.c*T+T/2, y:s.r*T+T/2,
    t:0,                // progress 0→1
    mode:'pen',
    penTimer: id===0?0:id*3000+500,
    fright:false, frightFlash:false,
    frozen:false, frozenTTL:0,
    eaten:false,
    player:null,        // local player index controlling this ghost
    qdr:0, qdc:0
  };
}

function stepGhost(g, dt){
  if(g.player!==null) return; // player-controlled ghosts move in stepPlayerGhosts

  if(g.frozen){g.frozenTTL-=dt;if(g.frozenTTL<=0)g.frozen=false;return;}

  if(g.mode==='pen'){
    g.penTimer-=dt;
    // Bob in pen
    g.y=g.r*T+T/2+Math.sin(Date.now()/300+g.id)*2;
    if(g.penTimer<=0){
      // Exit pen: go to row 11, col 14
      g.r=11;g.c=14;g.nr=11;g.nc=14;
      g.x=14*T+T/2;g.y=11*T+T/2;g.t=0;
      g.dr=-1;g.dc=0;
      g.mode='scatter';
    }
    return;
  }

  const spd = g.mode==='eaten' ? ghostBaseSpd*2.2
            : g.fright         ? ghostBaseSpd*0.5
            :                    ghostBaseSpd;

  // Advance progress
  g.t += spd/T * (dt/16.67);

  if(g.t>=1){
    g.t=0;
    g.r=g.nr; g.c=g.nc; // arrive at next tile

    // Check if returned to pen
    if(g.mode==='eaten'&&g.r>=12&&g.r<=16&&g.c>=11&&g.c<=16){
      g.mode='pen'; g.penTimer=1500+g.id*400;
      g.eaten=false; g.fright=false; g.frozen=false;
      g.dr=0; g.dc=0; g.t=0; g.nr=g.r; g.nc=g.c;
      return;
    }

    // Pick next tile
    const tgt=ghostTarget(g);
    const avDr=g.dc!==0||g.dr!==0?-g.dr:0;
    const avDc=g.dc!==0||g.dr!==0?-g.dc:0;
    const noPen=(g.mode!=='eaten');
    const step=bfs(g.r,g.c,tgt.r,tgt.c,avDr,avDc,noPen);
    if(step){
      g.dr=step.dr; g.dc=step.dc;
    } else {
      // fallback: any direction except reverse
      const DIRS=[{dr:-1,dc:0},{dr:1,dc:0},{dr:0,dc:-1},{dr:0,dc:1}];
      for(const d of DIRS){
        if(d.dr===avDr&&d.dc===avDc) continue;
        if(!isWall(g.r+d.dr,g.c+d.dc)){g.dr=d.dr;g.dc=d.dc;break;}
      }
    }
    g.nr=g.r+g.dr; g.nc=((g.c+g.dc)+NC)%NC;
    // Tunnel wrap
    if(g.nr<0)g.nr=NR-1; if(g.nr>=NR)g.nr=0;
  }

  // Interpolate position
  let nx=g.c*T+T/2+(g.nc-g.c)*T*g.t;
  let ny=g.r*T+T/2+(g.nr-g.r)*T*g.t;
  // Handle tunnel wrap (col crossing)
  if(Math.abs(g.nc-g.c)>1){
    if(g.dc>0) nx=g.c*T+T/2+g.t*T; // going right, wrap will teleport
    else nx=g.c*T+T/2-g.t*T;
    if(nx>NC*T) nx-=NC*T;
    if(nx<0) nx+=NC*T;
  }
  g.x=nx; g.y=ny;
}

function ghostTarget(g){
  const pr=pac.r, pc=pac.c;
  if(g.mode==='eaten') return{r:14,c:14};
  if(g.magnet) return {r:pr,c:pc};
  if(g.fright) return{r:((Math.random()*NR)|0),c:((Math.random()*NC)|0)};
  if(g.mode==='scatter') return [{r:1,c:26},{r:1,c:1},{r:29,c:26},{r:29,c:1}][g.id%4];
  switch(g.id%4){
    case 0: return{r:pr,c:pc};
    case 1: return{r:Math.max(0,pr+pac.dr*4),c:((pc+pac.dc*4+NC)%NC)};
    case 2:{const b=ghosts[0];const br=Math.round((b.y-T/2)/T),bc=Math.round((b.x-T/2)/T);return{r:Math.max(0,Math.min(NR-1,pr+(pr-br))),c:((pc+(pc-bc)+NC)%NC)};}
    case 3:{const d=Math.hypot(pr-g.r,pc-g.c);return d>8?{r:pr,c:pc}:{r:29,c:1};}
  }
}

function ghostEaten(g){
  boom(g.x,g.y,g.col,14); g.eaten=true; g.fright=false; g.frozen=false; g.mode='eaten';
}

// ── BOSS GHOST ────────────────────────────────────────
function makeBoss(bossNum){
  const b={
    x:14*T+T/2, y:14*T+T/2,
    r:14,c:14,nr:14,nc:14,
    dr:0,dc:0,t:0,
    hp: 5 + bossNum*3,
    maxHP: 5 + bossNum*3,
    spd: ghostBaseSpd*(1.7+bossNum*0.35),
    size: 1.3+bossNum*0.14,
    col:`hsl(${bossNum*40},100%,55%)`,
    mode:'chase',fright:false,dead:false,
    flashTimer:0,
    burstTimer:0, burstCooldown:5000
  };
  bossMaxHP=b.maxHP; bossHP=b.hp;
  return b;
}

function stepBoss(dt){
  if(!boss||boss.dead) return;

  if(bossFright){
    bossFrightTimer-=dt;
    if(bossFrightTimer<=0){bossFright=false;}
  }

  // Speed burst
  boss.burstTimer-=dt;
  if(boss.burstTimer<=0){
    boss.burstTimer=boss.burstCooldown;
    boom(boss.x,boss.y,'#FF4400',10);
  }

  const spd=bossFright?boss.spd*0.4:boss.spd*(boss.burstTimer<500?2.5:1);
  boss.t+=spd/T*(dt/16.67);

  if(boss.t>=1){
    boss.t=0; boss.r=boss.nr; boss.c=boss.nc;
    const tgt={r:pac.r,c:pac.c};
    const step=bfs(boss.r,boss.c,tgt.r,tgt.c,-boss.dr,-boss.dc,false);
    if(step){boss.dr=step.dr;boss.dc=step.dc;}
    boss.nr=boss.r+boss.dr;
    boss.nc=((boss.c+boss.dc)+NC)%NC;
    if(boss.nr<0)boss.nr=NR-1;if(boss.nr>=NR)boss.nr=0;
  }
  boss.x=boss.c*T+T/2+(boss.nc-boss.c)*T*boss.t;
  boss.y=boss.r*T+T/2+(boss.nr-boss.r)*T*boss.t;
}

// ── PLAYER GHOST CONTROL (multiplayer room) ──────────
const P2K={};
document.addEventListener('keydown',e=>{ P2K[e.code]=true; });
document.addEventListener('keyup',e=>delete P2K[e.code]);

function stepPlayerGhosts(dt){
  if(!multiMode) return;
  ghosts.forEach(g=>{
    if(g.player===null||g.mode==='pen') return;
    if(!g.qdr&&!g.qdc) return;
    const spd=ghostBaseSpd*(g.fright?0.5:1.2);
    const tileR=Math.round((g.y-T/2)/T), tileC=((Math.round((g.x-T/2)/T))%NC+NC)%NC;
    const midX=tileC*T+T/2, midY=tileR*T+T/2;
    if(Math.abs(g.x-midX)<spd+2&&Math.abs(g.y-midY)<spd+2){
      const ndr=g.qdr||0, ndc=g.qdc||0;
      if(!isWall(tileR+ndr,tileC+ndc)){
        g.dr=ndr; g.dc=ndc; g.x=midX; g.y=midY;
      }
    }
    const nx2=g.x+g.dc*spd, ny2=g.y+g.dr*spd;
    const tc2=Math.round((ny2-T/2)/T), tc3=((Math.round((nx2-T/2)/T))%NC+NC)%NC;
    if(!isWall(tc2,tc3)){g.x=nx2;g.y=ny2;}
    g.r=Math.round((g.y-T/2)/T); g.c=((Math.round((g.x-T/2)/T))%NC+NC)%NC;
    if(g.x<0)g.x=NC*T; if(g.x>NC*T)g.x=0;
  });
}

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();

  if(ST==='intro'){if(e.code==='Space'||e.code==='Enter'){advIntro(999);return;}}
  if(ST==='title'){if(e.code==='Space'||e.code==='Enter'){startGame();return;}}
  if(ST==='deadwait'){if(e.code==='Space'||e.code==='Enter'){doRespawn();return;}}
  if(ST==='bosswin'){if(e.code==='Space'){nextAfterBoss();return;}}
  if(ST==='gameover'||ST==='win'){if(e.code==='Space'){ST='title';return;}}
  if(ST==='store'){if(e.code==='Escape'||e.code==='KeyP'){ST='playing';return;}}
  if(ST==='multiplayer'){
    if(e.code==='Escape'){
      destroyPeer();
      multiplayerRoom=false;
      ST='title';
      updateMultiplayerPanel();
      return;
    }
  }
  if(ST==='playing'||ST==='paused'){
    if(e.code==='Escape')  {ST=ST==='store'?'playing':'store';return;}
    if(e.code==='KeyP')    {ST=ST==='paused'?'playing':'paused';pauseMenu.style.display=ST==='paused'?'block':'none';return;}
  }
  if(ST==='playing' && multiMode && peerRole==='client'){
    switch(e.code){
      case 'ArrowLeft': sendClientCommand(0,-1); break;
      case 'ArrowRight': sendClientCommand(0,1); break;
      case 'ArrowUp': sendClientCommand(-1,0); break;
      case 'ArrowDown': sendClientCommand(1,0); break;
    }
    return;
  }
  if(ST==='playing' && !multiMode){
    switch(e.code){
      case 'ArrowLeft':  pac.qr=0;pac.qc=-1;pac.qBuf=18;break;
      case 'ArrowRight': pac.qr=0;pac.qc=1; pac.qBuf=18;break;
      case 'ArrowUp':    pac.qr=-1;pac.qc=0;pac.qBuf=18;break;
      case 'ArrowDown':  pac.qr=1; pac.qc=0;pac.qBuf=18;break;
      case 'KeyW': if(owned.fireball){fireballAim={dr:-1,dc:0};showMsg('Fireball aimed up');} break;
      case 'KeyS': if(owned.fireball){fireballAim={dr:1,dc:0};showMsg('Fireball aimed down');} break;
      case 'KeyA': if(owned.fireball){fireballAim={dr:0,dc:-1};showMsg('Fireball aimed left');} break;
      case 'KeyD': if(owned.fireball){fireballAim={dr:0,dc:1};showMsg('Fireball aimed right');} break;
      case 'Space':
      case 'Enter': if(abQueue.length&&abCool<=0)useAbility();break;
    }
  } else if(ST==='playing' && multiMode){
    GHOST_CONTROL_SETS.forEach((set,i)=>{
      if(!activePlayers[i]) return;
      const g=ghosts[i];
      if(!g||g.mode==='pen') return;
      if(e.code===set.up){g.qdr=-1;g.qdc=0;}
      if(e.code===set.down){g.qdr=1; g.qdc=0;}
      if(e.code===set.left){g.qdr=0; g.qdc=-1;}
      if(e.code===set.right){g.qdr=0; g.qdc=1;}
    });
  }
});

// ── ABILITIES ─────────────────────────────────────────
function gainAbility(){
  // Only give abilities that are unlocked
  const available=AKEYS.filter(k=>{
    if(k==='fireball'&&!owned.fireball) return false;
    if(k==='magnet'&&!owned.magnet) return false;
    return true;
  });
  const k=available[Math.floor(Math.random()*available.length)];
  abQueue.push(k); abTok[k]++;
  boom(pac.x,pac.y,DEFS[k].col,22);
  showMsg(`${DEFS[k].ic} ${DEFS[k].nm} ACQUIRED!`);
  updateUI();
}

function useAbility(){
  if(!abQueue.length||abCool>0) return;
  const k=abQueue.shift(); lastAb=k;
  const d=DEFS[k],lv=abLv[k]-1;
  abCool=d.cool[lv]; superForm=k; superTimer=3000;
  switch(k){
    case 'fire':     doFire(lv);     break;
    case 'freeze':   doFreeze(lv);   break;
    case 'block':    doBlock(lv);    break;
    case 'zap':      doZap();        break;
    case 'speed':    doSpeed(lv);    break;
    case 'fireball': doFireball();   break;
    case 'magnet':   doMagnet(lv);   break;
  }
  showMsg(`${d.ic} ${d.nm.split(' ').slice(1).join(' ')}!`);
  updateUI();
}

function doFire(lv){
  const rad=DEFS.fire.rad[lv];
  let pts=0;
  ghosts.forEach(g=>{
    if(g.eaten||g.mode==='pen') return;
    if(Math.hypot(g.r-pac.r,g.c-pac.c)<=rad){ghostEaten(g);pts+=200*eatMul;eatMul*=2;}
  });
  if(boss&&!boss.dead&&Math.hypot(boss.r-pac.r,boss.c-pac.c)<=rad){boss.hp--;boom(boss.x,boss.y,'#FF4500',20);if(boss.hp<=0){boss.dead=true;endBoss();}}
  if(pts){score+=pts;showMsg(`+${pts} FIRE!`);}
  for(let i=0;i<72;i++){const a=i/72*Math.PI*2;addP(pac.x,pac.y,Math.cos(a)*3.5,Math.sin(a)*3.5,'#FF4500',45);}
  activeEff={type:'fire',ttl:700};
}
function doFreeze(lv){
  const dur=DEFS.freeze.dur[lv];
  ghosts.forEach(g=>{if(!g.eaten&&g.mode!=='pen'){g.frozen=true;g.frozenTTL=dur;}});
  for(let i=0;i<48;i++)addP(pac.x,pac.y,Math.cos(i*.13)*2.5,Math.sin(i*.13)*2.5,'#00BFFF',50);
  activeEff={type:'freeze',ttl:dur};
  setTimeout(()=>ghosts.forEach(g=>{g.frozen=false;g.frozenTTL=0;}),dur);
}
function doBlock(lv){
  shieldOn=true;shieldTTL=DEFS.block.dur[lv];
  for(let i=0;i<28;i++)addP(pac.x,pac.y,(Math.random()-.5)*5,(Math.random()-.5)*5,'#9B59B6',38);
  activeEff={type:'block',ttl:shieldTTL};
}
function doZap(){
  ghosts.forEach(g=>{
    boom(g.x,g.y,'#F1C40F',12);
    g.r=14;g.c=14;g.nr=14;g.nc=14;
    g.x=14*T+T/2;g.y=14*T+T/2;
    g.mode='pen';g.penTimer=1000+g.id*500;
    g.eaten=false;g.fright=false;g.frozen=false;g.dr=0;g.dc=0;g.t=0;
  });
  for(let i=0;i<80;i++){const a=Math.random()*Math.PI*2,s=Math.random()*5+2;addP(pac.x,pac.y,Math.cos(a)*s,Math.sin(a)*s,'#F1C40F',38);}
  activeEff={type:'zap',ttl:550};
}
function doSpeed(lv){
  speedOn=true;speedTTL=DEFS.speed.dur[lv];
  for(let i=0;i<22;i++)addP(pac.x-i*3,pac.y,-1.5,(Math.random()-.5)*1.5,'#2ECC71',20);
  activeEff={type:'speed',ttl:speedTTL};
  setTimeout(()=>speedOn=false,speedTTL);
}
function doFireball(){
  const dr = fireballAim.dr || pac.dr;
  const dc = fireballAim.dc || pac.dc;
  if(dr===0&&dc===0) return;
  projectiles.push({x:pac.x,y:pac.y,dr,dc,ttl:2000,col:'#FF6600',spd:4});
}
function doMagnet(lv){
  const dur=DEFS.magnet.dur[lv];
  ghosts.forEach(g=>{
    if(!g.eaten&&g.mode!=='pen'){
      g.magnet=true;
      g.fright=true;
      g.mode='fright';
    }
  });
  boom(pac.x,pac.y,'#EE44FF',30);
  activeEff={type:'magnet',ttl:dur};
}
function doUpgrade(){
  const k=AKEYS.find(k=>abTok[k]>=3&&abLv[k]<3);
  if(!k) return;
  abTok[k]-=3;abLv[k]++;
  boom(pac.x,pac.y,DEFS[k].col,40);
  showMsg(`${DEFS[k].ic} UPGRADED TO LV${abLv[k]}!`);
  updateUI();
}

// ── PARTICLES ─────────────────────────────────────────
function addP(x,y,vx,vy,col,life){parts.push({x,y,vx,vy,col,life,ml:life,sz:Math.random()*2.2+0.7});}
function boom(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*3.5+1;addP(x,y,Math.cos(a)*s,Math.sin(a)*s,col,Math.random()*22+10);}}
function tickP(dt){parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.life-=dt/16;return p.life>0;});}

// ── LIFECYCLE ─────────────────────────────────────────
function doPacDeath(){
  if(!pac.alive) return;
  pac.alive=false;pac.deathF=0;
  boom(pac.x,pac.y,'#FFD700',35);
  superForm=null;shieldOn=false;speedOn=false;activeEff=null;
  ST='dead';
}
function startLevelWin(){
  ST='levelwin';lvTick=200;
  score+=50*(level); coins+=level*10;
  showMsg(`LEVEL ${level} CLEAR! +${50*level}`);
  if(level%5===0){

      resetRound();
      showMsg('⚠️ BOSS FIGHT!');
    },2500);
  }
}
function endBoss(){

function makePeer(id){
  if(peer){ try{peer.destroy();}catch{} peer=null; }
  peerDataConns={}; peerConn=null;
  try{ peer = id? new Peer(id) : new Peer(); }
  catch(err){ showMsg('Peer init failed'); console.error(err); peerStatus='error'; updateUI(); return; }
  peer.on('open', ()=>{ peerStatus='ready'; updateUI(); });
  peer.on('error', err=>{ peerStatus='error'; showMsg('Peer error'); console.warn(err); updateUI(); });
  peer.on('disconnected', ()=>{ peerStatus='disconnected'; updateUI(); });
  peer.on('close', ()=>{ peerStatus='closed'; updateUI(); });
  if(peerRole==='host'){
    peer.on('connection',conn=>{ setupHostConnection(conn); });
  }
}
function destroyPeer(){
  if(peer){ try{peer.destroy();}catch{} peer=null; }
  peerRole=null; peerRoomId=''; peerStatus='idle'; peerConn=null; peerDataConns={}; peerPlayerRoles={}; peerPacClientId=null; peerGhostMap={}; clientRole=null; clientGhostId=null;
}
function randomRoomCode(){ return Math.random().toString(36).slice(2,6).toUpperCase(); }
function setupHostConnection(conn){
  const peerId=conn.peer;
  peerDataConns[peerId]=conn;
  peerPlayerRoles[peerId]={role:'waiting',ghostId:null};
  peerPacClientId=null;
  peerStatus='connected'; updateUI(); updateMultiplayerPanel();
  conn.on('data', data=>{ if(typeof data==='string'){ try{data=JSON.parse(data);}catch{} } handlePeerMessage(conn,data); });
  conn.on('close', ()=>{
    delete peerPlayerRoles[peerId];
    delete peerDataConns[peerId];
    peerStatus=Object.keys(peerDataConns).length?'connected':'waiting'; updateUI(); updateMultiplayerPanel();
  });
  conn.on('error', err=>{ console.warn('Peer host conn error',err); });
  conn.on('open', ()=>{ sendPeerStateToConn(conn); updateMultiplayerPanel(); });
}
function setupClientConnection(conn){
  peerConn=conn; peerStatus='connected'; updateUI(); updateMultiplayerPanel();
  conn.on('data', data=>{ if(typeof data==='string'){ try{data=JSON.parse(data);}catch{} } handlePeerMessage(conn,data); });
  conn.on('close', ()=>{ peerStatus='closed'; updateUI(); updateMultiplayerPanel(); });
  conn.on('error', err=>{ console.warn('Peer client conn error',err); updateMultiplayerPanel(); });
}
function startMatch(){
  if(peerRole!=='host') return;
  const peerIds=Object.keys(peerDataConns);
  const playerCount=peerIds.length;
  if(playerCount===0){ showMsg('Need at least one player to start.'); return; }
  const pacIndex=Math.floor(Math.random()*playerCount);
  const ghostIds=[0,3,1,2]; // first available ghost is red, next is yellow
  peerIds.forEach((peerId,index)=>{
    if(index===pacIndex){
      peerPlayerRoles[peerId]={role:'pac',ghostId:null};
      peerPacClientId=peerId;
    } else if(ghostIds.length>0){
      const ghostId=ghostIds.shift();
      peerPlayerRoles[peerId]={role:'ghost',ghostId};
    } else {
      peerPlayerRoles[peerId]={role:'waiting',ghostId:null};
    }
  });

  multiMode=true;
  multiplayerRoom=false;
  ST='playing';
  activePlayers=[false,false,false,false];
  peerIds.forEach(peerId=>{
    const roleInfo=peerPlayerRoles[peerId];
    if(roleInfo.role==='ghost' && roleInfo.ghostId!=null){ activePlayers[roleInfo.ghostId]=true; }
  });
  resetRound();
  updateUI();

  Object.entries(peerDataConns).forEach(([peerId,conn])=>{
    const roleInfo=peerPlayerRoles[peerId]||{role:'waiting'};
    if(conn.open){
      sendPeerStateToConn(conn);
      conn.send(JSON.stringify({type:'assign',role:roleInfo.role,ghostId:roleInfo.ghostId}));
      conn.send(JSON.stringify({type:'start'}));
    }
  });
  showMsg('Multiplayer match started!');
}
function startMultiplayerClient(){ multiMode=true; multiplayerRoom=false; ST='playing'; updateUI(); showMsg('Joined room. Match started.'); }
function handlePeerMessage(conn,data){
  if(!data||typeof data!=='object') return;
  if(data.type==='assign'&&peerRole==='client'){
    clientRole=data.role||'waiting';
    clientGhostId=data.ghostId!=null?data.ghostId:null;
    if(clientRole==='pac'){ showMsg('You are Pac-Man!'); }
    else if(clientRole==='ghost'){ showMsg(`You control Ghost ${clientGhostId+1}`); }
    else { showMsg('Waiting for host to start...'); }
    updateMultiplayerPanel();
  } else if(data.type==='state'){ applyPeerState(data); }
  else if(data.type==='cmd'&&peerRole==='host'){
    if(data.role==='pac'){
      pac.qr=data.dr; pac.qc=data.dc; pac.qBuf=18;
    } else if(data.role==='ghost'){
      const g=ghosts[data.ghostId]; if(g){ g.qdr=data.dr; g.qdc=data.dc; }
    }
  } else if(data.type==='start'&&peerRole==='client'){
    startMultiplayerClient();
  }
}
function hostRoom(){ destroyPeer(); peerRoomId=randomRoomCode(); peerRole='host'; peerStatus='waiting'; makePeer('room-'+peerRoomId); showMsg(`Room ${peerRoomId} created.`); updateUI(); }
function joinRoom(code){ if(!code) return; destroyPeer(); peerRoomId=code.toUpperCase(); peerRole='client'; peerStatus='connecting'; makePeer(); if(peer){ peer.on('open', ()=>{ const conn=peer.connect('room-'+peerRoomId); conn.on('open', ()=>setupClientConnection(conn)); conn.on('error', err=>{ peerStatus='error'; showMsg('Join failed'); console.warn(err); updateUI(); }); }); } }
function applyPeerState(data){ if(data.maze){ maze=data.maze.map(row=>row.slice()); } if(!pac){ pac=makePac(); } Object.assign(pac,{x:data.pac.x,y:data.pac.y,dr:data.pac.dr,dc:data.pac.dc,r:data.pac.r,c:data.pac.c,alive:data.pac.alive}); ghosts=data.ghosts.map(g=>({ id:g.id, col:g.col, name:g.name, r:g.r, c:g.c, nr:g.nr, nc:g.nc, dr:g.dr, dc:g.dc, x:g.x, y:g.y, t:g.t, mode:g.mode, penTimer:g.penTimer, fright:g.fright, frightFlash:g.frightFlash, frozen:g.frozen, frozenTTL:g.frozenTTL, eaten:g.eaten, player:g.player!==null?g.player:null, qdr:0, qdc:0 })); if(data.fruit){ fruit={type:data.fruit.type,x:data.fruit.x,y:data.fruit.y}; } else fruit=null; dotsEaten=data.dotsEaten; totalDots=data.totalDots; score=data.score; lives=data.lives; level=data.level; timeLeft=data.timeLeft; mapIndex=data.mapIndex; }
function sendClientCommand(dr,dc){
  if(peerRole!=='client' || !peerConn || !clientRole) return;
  const msg={type:'cmd',role:clientRole,dr,dc};
  if(clientRole==='ghost'){ msg.ghostId=clientGhostId; }
  peerConn.send(JSON.stringify(msg));
}
function sendPeerStateToConn(conn){ if(peerRole!=='host'||!conn||!conn.open) return; const state={type:'state', maze:maze, pac:{x:pac.x,y:pac.y,dr:pac.dr,dc:pac.dc,r:pac.r,c:pac.c,alive:pac.alive}, ghosts:ghosts.map(g=>({id:g.id,col:g.col,name:g.name,r:g.r,c:g.c,nr:g.nr,nc:g.nc,dr:g.dr,dc:g.dc,x:g.x,y:g.y,t:g.t,mode:g.mode,penTimer:g.penTimer,fright:g.fright,frightFlash:g.frightFlash,frozen:g.frozen,frozenTTL:g.frozenTTL,eaten:g.eaten,player:g.player})), fruit:fruit?{type:fruit.type,x:fruit.x,y:fruit.y}:null, dotsEaten,totalDots,score,lives,level,timeLeft,mapIndex}; conn.send(JSON.stringify(state)); }
function broadcastPeerState(){ if(peerRole!=='host') return; Object.values(peerDataConns).forEach(conn=>{ sendPeerStateToConn(conn); }); }
function createMultiplayerPanel(){ const panel=document.createElement('div'); panel.id='multiplayerPanel'; panel.style.position='absolute'; panel.style.left='50%'; panel.style.top='50%'; panel.style.transform='translate(-50%,-50%)'; panel.style.background='rgba(0,0,0,0.95)'; panel.style.border='2px solid #333'; panel.style.padding='12px'; panel.style.display='none'; panel.style.zIndex=9999; panel.style.textAlign='center'; panel.style.width='280px'; panel.innerHTML=`<div style="color:#FFD700;font-weight:bold;margin-bottom:8px;">MULTIPLAYER LOBBY</div><div style="margin-bottom:8px;font-size:11px;">Enter a host code to join an active room, or create your own room below.</div><input id="joinCodeInput" placeholder="Enter host code" style="width:100%;margin-bottom:6px;padding:6px;border:1px solid #444;background:#111;color:#fff;" maxlength="6" /><button id="joinRoomBtn" style="display:block;margin:4px auto;padding:8px;width:100%;background:#222;border:1px solid #666;color:#fff;">Join Room</button><div style="margin:8px 0 4px;font-size:11px;color:#aaa;">or create a new room</div><button id="hostRoomBtn" style="display:block;margin:4px auto;padding:8px;width:100%;background:#33001a;border:1px solid #FF69B4;color:#FF69B4;">Create Room</button><button id="startMatchBtn" style="display:none;margin:4px auto;padding:8px;width:100%;background:#226633;border:1px solid #55CC88;color:#fff;">Start Match</button><button id="leaveRoomBtn" style="display:block;margin:8px auto;padding:6px;width:100%;">Back to Title</button><div id="roomHelp" style="margin-top:10px;font-size:10px;color:#ccc;">Room code will appear here once you host one.</div><div style="margin-top:6px;font-size:10px;color:#ccc;">Current room: <span id="roomCodeDisplay">--</span> · Status: <span id="roomStatusDisplay">idle</span></div>`; document.body.appendChild(panel); document.getElementById('hostRoomBtn').addEventListener('click',()=>{ hostRoom(); updateMultiplayerPanel(); }); document.getElementById('joinRoomBtn').addEventListener('click',()=>{ joinRoom(document.getElementById('joinCodeInput').value); updateMultiplayerPanel(); }); document.getElementById('startMatchBtn').addEventListener('click',()=>{ startMatch(); updateMultiplayerPanel(); }); document.getElementById('leaveRoomBtn').addEventListener('click',()=>{ destroyPeer(); ST='title'; multiplayerRoom=false; panel.style.display='none'; updateMultiplayerPanel(); }); }

function drawMaze(){
  for(let r=0;r<NR;r++){
    for(let c=0;c<NC;c++){
      const v=maze[r][c],x=c*T,y=r*T;
      if(v===1){
        CX.fillStyle=lvFlash?'#5566EE':'#0033BB';
        CX.fillRect(x,y,T,T);
        CX.strokeStyle=lvFlash?'#99AAFF':'#0055EE';
        CX.lineWidth=1;CX.strokeRect(x+0.5,y+0.5,T-1,T-1);
      }else if(v===2){
        CX.fillStyle='#FFEE88';
        CX.beginPath();CX.arc(x+T/2,y+T/2,2,0,Math.PI*2);CX.fill();
      }else if(v===3){
        const p=0.55+0.45*Math.sin(Date.now()/200);
        CX.shadowColor='#FFF';CX.shadowBlur=8*p;
        CX.fillStyle='#FFF';
        CX.beginPath();CX.arc(x+T/2,y+T/2,5*p,0,Math.PI*2);CX.fill();
        CX.shadowBlur=0;
      }
    }
  }
  // Ghost door
  CX.fillStyle='#FFB852';CX.fillRect(12*T+3,12*T+5,3*T-6,3);
}

function drawPac(){
  const x=pac.x,y=pac.y,r=T/2-1;
  if(!pac.alive){
    const frac=Math.min(pac.deathF/28,1);
    CX.save();CX.translate(x,y);CX.rotate(-Math.PI/2);
    if(frac<1){
      CX.fillStyle='#FFD700';
      const a=Math.PI*frac;
      CX.beginPath();CX.moveTo(0,0);CX.arc(0,0,r,a,(2-a)*Math.PI);CX.closePath();CX.fill();
    }
    CX.restore();return;
  }

  // Aura based on ability level
  if(superForm){
    const ab=DEFS[superForm],lv=abLv[superForm];
    const ar=r+6+lv*3+2*Math.sin(Date.now()/140);
    CX.save();CX.translate(x,y);
    const gd=CX.createRadialGradient(0,0,r-2,0,0,ar);
    gd.addColorStop(0,ab.col+'77');gd.addColorStop(1,'transparent');
    CX.fillStyle=gd;CX.beginPath();CX.arc(0,0,ar,0,Math.PI*2);CX.fill();
    // Cape
    const dir2=Math.atan2(pac.dr,pac.dc)||0;
    CX.save();CX.rotate(dir2);
    CX.fillStyle=ab.col+'cc';
    CX.beginPath();CX.moveTo(-r*.4,r*.25);
    CX.quadraticCurveTo(-r*(1.3+lv*.2),r*(1.3+lv*.2),0,r*(0.9+lv*.15));
    CX.quadraticCurveTo(r*(1.3+lv*.2),r*(1.3+lv*.2),r*.4,r*.25);
    CX.fill();CX.restore();
    // LV3: Wings
    if(lv>=3){
      CX.fillStyle=ab.col+'99';
      CX.beginPath();CX.ellipse(-r*1.5,-r*.5,r*1.2,r*.5,-.5,0,Math.PI*2);CX.fill();
      CX.beginPath();CX.ellipse(r*1.5,-r*.5,r*1.2,r*.5,.5,0,Math.PI*2);CX.fill();
    }
    CX.restore();
  }

  CX.save();CX.translate(x,y);
  const dir=(pac.dr===0&&pac.dc===0)?0:Math.atan2(pac.dr,pac.dc);
  CX.rotate(dir);
  const bc=superForm?DEFS[superForm].col:'#FFD700';
  if(superForm){CX.shadowColor=DEFS[superForm].glow;CX.shadowBlur=8+abLv[superForm]*3;}
  CX.fillStyle=bc;
  CX.beginPath();CX.moveTo(0,0);
  CX.arc(0,0,r,pac.mouth*Math.PI,(2-pac.mouth)*Math.PI);
  CX.closePath();CX.fill();CX.shadowBlur=0;
  // Eye
  CX.fillStyle='#000';CX.beginPath();CX.arc(-r*.05,-r*.52,r*.13,0,Math.PI*2);CX.fill();
  // Mask (hero)
  if(superForm){CX.fillStyle='rgba(0,0,0,.4)';CX.fillRect(-r*.46,-r*.63,r*.92,r*.22);}
  // Crown at LV3
  if(superForm&&abLv[superForm]>=3){
    CX.fillStyle='#FFD700';
    CX.beginPath();CX.moveTo(-r*.4,-r*.8);CX.lineTo(-r*.2,-r*.5);CX.lineTo(0,-r*.8);
    CX.lineTo(r*.2,-r*.5);CX.lineTo(r*.4,-r*.8);CX.lineTo(r*.4,-r);CX.lineTo(-r*.4,-r);CX.closePath();CX.fill();
  }
  CX.restore();
  // Shield
  if(shieldOn){
    const p=0.5+0.5*Math.sin(Date.now()/80);
    CX.strokeStyle=`rgba(155,89,182,${0.5+0.3*p})`;CX.lineWidth=3;
    CX.shadowColor='#9B59B6';CX.shadowBlur=8;
    CX.beginPath();CX.arc(x,y,r+9+p*2,0,Math.PI*2);CX.stroke();CX.shadowBlur=0;
  }
}

function drawGhosts(){
  [...ghosts,...(boss&&!boss.dead?[]:[])]
    .forEach(g=>drawOneGhost(g,1));
  if(boss&&!boss.dead) drawBoss();
}

function drawOneGhost(g,scale){
  if(g.mode==='pen') return;
  CX.save();CX.translate(g.x,g.y);
  const r2=(T/2-1)*scale;
  if(g.mode==='eaten'){drawGEyes(CX,g);CX.restore();return;}
  let gc=g.col;
  if(g.fright){gc=(frightLeft<2200&&Math.floor(Date.now()/260)%2===0)?'#FFF':'#2233CC';}
  if(g.frozen){gc='#87CEEB';CX.globalAlpha=0.8;}
  if(g.player!==null){
    CX.fillStyle='#FFD700';
    CX.beginPath();CX.arc(0,-r2-5,3,0,Math.PI*2);CX.fill();
    CX.font='8px serif';CX.textAlign='center';CX.fillText(`P${g.player+1}`,0,-r2-8);
  }
  CX.fillStyle=gc;CX.shadowColor=gc;CX.shadowBlur=4;
  CX.beginPath();CX.arc(0,-2*scale,r2,Math.PI,0);
  CX.lineTo(r2,8*scale);
  CX.quadraticCurveTo(r2*.6*scale,3*scale,r2*.2*scale,8*scale);
  CX.quadraticCurveTo(-r2*.2*scale,12*scale,-r2*.6*scale,8*scale);
  CX.lineTo(-r2,8*scale);CX.closePath();CX.fill();CX.shadowBlur=0;
  if(g.frozen){CX.fillStyle='rgba(135,206,235,.3)';CX.beginPath();CX.arc(0,-2*scale,r2+2,0,Math.PI*2);CX.fill();}
  if(!g.fright) drawGEyes(CX,g,scale);
  else{
    CX.strokeStyle='rgba(255,255,255,.8)';CX.lineWidth=1.5;
    CX.beginPath();CX.arc(-3*scale,-3*scale,3*scale,Math.PI*1.1,Math.PI*1.9);CX.stroke();
    CX.beginPath();CX.arc(4*scale,-3*scale,3*scale,Math.PI*1.1,Math.PI*1.9);CX.stroke();
  }
  CX.globalAlpha=1;CX.restore();
}

function drawBoss(){
  const b=boss, s=b.size;
  CX.save();CX.translate(b.x,b.y);
  const r2=(T/2)*s;
  let gc=bossFright?(Math.floor(Date.now()/260)%2===0?'#FFF':'#2233CC'):b.col;
  CX.shadowColor=gc;CX.shadowBlur=15;
  CX.fillStyle=gc;
  // Big body
  CX.beginPath();CX.arc(0,-2,r2,Math.PI,0);
  CX.lineTo(r2,10);
  CX.quadraticCurveTo(r2*.7,5,r2*.3,10);
  CX.quadraticCurveTo(0,15,-r2*.3,10);
  CX.quadraticCurveTo(-r2*.7,5,-r2,10);
  CX.closePath();CX.fill();CX.shadowBlur=0;
  // Crown on boss
  CX.fillStyle='#FFD700';
  CX.beginPath();CX.moveTo(-r2*.6,-r2);CX.lineTo(-r2*.4,-r2*.6);CX.lineTo(0,-r2);
  CX.lineTo(r2*.4,-r2*.6);CX.lineTo(r2*.6,-r2);CX.lineTo(r2*.6,-r2*1.2);CX.lineTo(-r2*.6,-r2*1.2);CX.closePath();CX.fill();
  // Eyes
  drawGEyes(CX,b,s);
  // HP bar
  CX.fillStyle='#333';CX.fillRect(-r2,-r2*1.5-4,r2*2,4);
  CX.fillStyle='#FF4444';CX.fillRect(-r2,-r2*1.5-4,(r2*2)*b.hp/b.maxHP,4);
  CX.strokeStyle='#fff';CX.lineWidth=0.5;CX.strokeRect(-r2,-r2*1.5-4,r2*2,4);
  CX.restore();
}

function drawGEyes(ctx,g,scale=1){
  ctx.fillStyle='#FFF';
  ctx.beginPath();ctx.arc(-3*scale,-3*scale,4*scale,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(4*scale,-3*scale,4*scale,0,Math.PI*2);ctx.fill();
  const dc2=g.dc||0,dr2=g.dr||0;
  ctx.fillStyle='#00F';
  ctx.beginPath();ctx.arc((-2+dc2*2)*scale,(-3+dr2*2)*scale,2*scale,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc((5+dc2*2)*scale,(-3+dr2*2)*scale,2*scale,0,Math.PI*2);ctx.fill();
}

  STORE_ITEMS.forEach((item,i)=>{

    const x=8+col*iw, y=startY+row*itemH;
    const bought=owned[item.id]>=item.max;
    const canBuy=coins>=item.cost&&!bought;

    CX.fillStyle=bought?'#001100':canBuy?'#001520':'#0a0a0a';
    CX.fillRect(x,y,iw-4,itemH-4);
    CX.strokeStyle=bought?'#00FF00':canBuy?'#00BFFF':'#222';
    CX.lineWidth=1;CX.strokeRect(x,y,iw-4,itemH-4);

    CX.textAlign='left';

    CX.fillStyle=bought?'#00FF00':canBuy?'#FFD700':'#444';
    CX.textAlign='right';CX.font='7px Courier New';

    item._x=x;item._y=y;item._w=iw-4;item._h=itemH-4;
  });

  // Click handler
  if(!CV._storeClick){
    CV._storeClick=true;
    CV.addEventListener('click',e=>{
      if(ST!=='store') return;
      const rect=CV.getBoundingClientRect();
      const mx=e.clientX-rect.left, my=e.clientY-rect.top;
      STORE_ITEMS.forEach(item=>{
        if(item._x&&mx>item._x&&mx<item._x+item._w&&my>item._y&&my<item._y+item._h)
          buyItem(item);
      });
    });
  }
}

    qr.appendChild(s);
  });}
  // Ability panel
  const ck=abQueue.length?abQueue[0]:lastAb;
  if(ck){
    const d=DEFS[ck],lv=abLv[ck];
    document.getElementById('abicon').textContent=d.ic;

    document.getElementById('abstars').innerHTML='⭐'.repeat(lv)+'☆'.repeat(3-lv);

  }
  // Tokens
  const tl=document.getElementById('toklist');tl.innerHTML='';

    if(k==='fireball'&&!owned.fireball) return;

    tl.appendChild(row);

  const canUp=AKEYS.some(k=>abTok[k]>=3&&abLv[k]<3);
  const btn=document.getElementById('upbtn');
  btn.disabled=!canUp;btn.className=canUp?'on':'';
  if(canUp){const k=AKEYS.find(k=>abTok[k]>=3&&abLv[k]<3);btn.textContent=`⬆ UPGRADE ${DEFS[k].ic} (3 tokens)`;}
  else btn.textContent='⬆ UPGRADE (need 3 tokens)';
  // Store button unlocked items
  document.getElementById('multibtn').textContent=multiMode?'👥 MULTI MATCH':'👥 MULTIPLAYER ROOM';
}

// ── MAIN LOOP ──────────────────────────────────────────
let last=0;
function loop(now){
  const dt=Math.min(now-last,50);last=now;
  CX.fillStyle='#000';CX.fillRect(0,0,CV.width,CV.height);

  // ── INTRO
  if(ST==='intro'){
    introTimer+=dt;
    if(introTimer>3500){advIntro();introTimer=0;}
    drawIntro();
    requestAnimationFrame(loop);return;
  }
  // ── TITLE
  if(ST==='title'){drawTitle();requestAnimationFrame(loop);return;}
  // ── MULTIPLAYER ROOM
  if(ST==='multiplayer'){drawMultiplayerRoom();drawMsg(dt);requestAnimationFrame(loop);return;}
  // ── STORE
  if(ST==='store'){drawStore();drawMsg(dt);requestAnimationFrame(loop);return;}
  // ── GAME OVER / WIN
  if(ST==='gameover'){drawMaze();drawGameOver();requestAnimationFrame(loop);return;}
  if(ST==='bosswin'){drawMaze();drawPac();drawBossWin();requestAnimationFrame(loop);return;}

  // ── PLAYING / DEAD / LEVELWIN / BOSS
  drawMaze();

  if(ST==='playing'||ST==='boss'){
    // Timers
    if(frightLeft>0){frightLeft-=dt;if(frightLeft<=0){frightLeft=0;ghosts.forEach(g=>{if(g.fright){g.fright=false;g.mode=g.mode==='fright'?'scatter':g.mode;}});}}
    if(abCool>0) abCool-=dt;
    if(shieldOn){shieldTTL-=dt;if(shieldTTL<=0)shieldOn=false;}
    if(activeEff) activeEff.ttl-=dt;
    if(superTimer>0){superTimer-=dt;if(superTimer<=0)superForm=null;}
    // Fruit
    if(fruit){fruitTTL-=dt;if(fruitTTL<=0)fruit=null;}
    if(!fruit&&(dotsEaten===70||dotsEaten===170)){
      fruit={type:Math.min(level-1,FRUITS.length-1),x:14*T+T/2,y:17*T+T/2};
      fruitTTL=9000+Math.random()*4000;
    }
    // Ghost wave
    if(dotsEaten>totalDots*.4) ghosts.forEach(g=>{if(g.mode==='scatter')g.mode='chase';});

    stepPac(dt);
    ghosts.forEach(g=>stepGhost(g,dt));
    stepPlayerGhosts(dt);
    if(ST==='boss') stepBoss(dt);

    // Projectiles
    projectiles=projectiles.filter(p=>{
      p.x+=p.dc*p.spd;p.y+=p.dr*p.spd;p.ttl-=dt;
      if(isWall(Math.round((p.y-T/2)/T),Math.round((p.x-T/2)/T))) return false;
      ghosts.forEach(g=>{if(!g.eaten&&Math.hypot(p.x-g.x,p.y-g.y)<T){ghostEaten(g);}});
      return p.ttl>0;
    });

    if(peerRole==='host' && Date.now()-lastPeerSend>120){ broadcastPeerState(); lastPeerSend=Date.now(); }

    tickP(dt);
    updateUI();
  }

  if(ST==='dead'){
    pac.deathF++;tickP(dt);
    if(pac.deathF>38){ST='deadwait';}
  }

  if(ST==='levelwin'){
    lvTick--;lvFlash=Math.floor(lvTick/8)%2===0;tickP(dt);
    if(lvTick<=0&&ST==='levelwin'){
      // Check if boss level
      if(level%5===0){
        ST='boss';
        boss=makeBoss(Math.floor(level/5));
        buildMaze(mapIndex);
        resetRound();
      } else {
        level++;
        if(level%5===0) mapIndex=(Math.floor(level/5))%4;
        ghostBaseSpd=1.9+(level-1)*0.06;
        baseSpd=1.9+(level-1)*0.03;
        buildMaze(mapIndex);
        resetRound();
        lvFlash=false;ST='playing';
        showMsg(`✨ LEVEL ${level}!`);
        updateUI();
      }
    }
  }

  drawEffect();
  drawFruit();
  drawGhosts();
  drawPac();
  drawProjectiles();
  drawParticles();
  if(ST==='boss') drawBossIntro();
  if(ST==='deadwait') drawDeadWait();
  drawHUD();
  drawMsg(dt);

  requestAnimationFrame(loop);
}

// ── BOOT ──────────────────────────────────────────────
buildMaze(0);
pac=makePac();
ghosts=GNAMES.map((_,i)=>makeGhost(i));
createMultiplayerPanel();
updateUI();
requestAnimationFrame(t=>{last=t;loop(t);});
</script>
</body>
</html>
